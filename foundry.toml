# Foundry configuration for the Proof-of-Dev smart contracts.
#
# Usage:
#   curl -L https://foundry.paradigm.xyz | bash   (then: foundryup)   # install
#   # forge-std goes in foundry-lib/ (NOT lib/, which is the app's TS source):
#   git clone --depth 1 https://github.com/foundry-rs/forge-std foundry-lib/forge-std
#   forge build                                                       # compile
#   forge test -vvv                                                   # run tests
#
# On Windows, run these from Git Bash / WSL, or use the Windows release binaries.
#
# NOTE: libs is set to "foundry-lib" (not the default "lib") because this repo's
# lib/ folder holds the Next.js TypeScript source — we must not mix the two.

[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["foundry-lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
# Treat warnings as informative; fail the build only on errors.
verbosity = 3

[fmt]
line_length = 100
tab_width = 4

# Etherscan verification (used by `forge script ... --verify` and `forge verify-contract`).
# Set ETHERSCAN_API_KEY in your environment.
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[rpc_endpoints]
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
